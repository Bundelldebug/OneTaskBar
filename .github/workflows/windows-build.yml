name: Windows build
on:
  push:
    branches: [main, codex/ui-9-5-beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile
        shell: pwsh
        run: ./Build.ps1 -SkipTests
      - name: Validate isolated UI and lifecycle fixtures
        shell: pwsh
        run: ./tools/Test-UI.ps1 -Area All -OutputDirectory (Join-Path $env:RUNNER_TEMP 'OneTaskBar-tests')
      - name: Package unsigned candidate
        shell: pwsh
        run: |
          ./tools/BuildInstaller.ps1 -SkipBuild
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path ./dist/OneTaskBar.exe))
          [ordered]@{commit=$env:GITHUB_SHA;run=('https://github.com/'+$env:GITHUB_REPOSITORY+'/actions/runs/'+$env:GITHUB_RUN_ID);version=$info.FileVersion;productVersion=$info.ProductVersion;unsigned=$true} | ConvertTo-Json | Set-Content -LiteralPath release/candidate-origin.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-report
          path: |
            ${{ runner.temp }}/OneTaskBar-tests/summary.json
            ${{ runner.temp }}/OneTaskBar-tests/*/*-probe.json
            ${{ runner.temp }}/OneTaskBar-tests/self-test/self-test.json
          if-no-files-found: warn
          retention-days: 14

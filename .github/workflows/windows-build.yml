name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and validate
        shell: pwsh
        run: |
          ./Build.ps1 -SkipTests
          $env:ONE_TASKBAR_DATA = Join-Path $env:RUNNER_TEMP 'OneTaskBar-self-test'
          New-Item -ItemType Directory -Path $env:ONE_TASKBAR_DATA -Force | Out-Null
          $test = Start-Process -FilePath ./dist/OneTaskBar.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { Get-Content (Join-Path $env:ONE_TASKBAR_DATA 'self-test.json'); throw 'Self-test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-report
          path: ${{ runner.temp }}/OneTaskBar-self-test/self-test.json
          if-no-files-found: warn
          retention-days: 14
